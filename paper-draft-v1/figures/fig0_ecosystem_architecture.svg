      <text x="275" y="24" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400E">HITL Staging Staging</text>
      <text x="275" y="44" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#64748B">Candidate Review &amp; Audit Trail</text>
      
      <!-- Feature 3 -->
      <rect x="520" y="0" width="240" height="65" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="535" y="24" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400E">Soft Deletion</text>
      <text x="535" y="44" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#64748B">ACID Commit &amp; Fallback Rollback</text>
      
      <!-- Feature 4 -->
      <rect x="780" y="0" width="240" height="65" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
      <text x="795" y="24" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400E">Multi-Tenant SaaS</text>
      <text x="795" y="44" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#64748B">organizationId Data Isolation</text>
    </g>
