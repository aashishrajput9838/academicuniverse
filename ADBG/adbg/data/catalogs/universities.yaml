# ----------------------------------------------------------
# ADBG University Catalog
# ----------------------------------------------------------
# Each university defines its complete academic configuration.
# To add a new university, append an entry to this file.
# No Python code changes required.
# ----------------------------------------------------------

universities:

  - id: university_alpha
    name: "Vivekananda Technical University"
    short_code: "VTU"
    address:
      line1: "VTU Campus, Dwarka Sector 14"
      city: "New Delhi"
      state: "Delhi"
      pin: "110078"
      country: "India"
      note: "Fictional Institution — For Research Purposes Only"
    tagline: "Excellence in Engineering and Research"
    colors:
      primary: "#1a2e5a"
      secondary: "#3b82f6"
      text: "#333333"
      accent: "#e63946"
    fonts:
      heading: "Helvetica-Bold"
      body: "Helvetica"
      monospace: "Courier"
    grading_scheme:
      type: "grade_point"
      scale: 10.0
      pass_marks: 40
      bands:
        - { min_marks: 90, grade: "O",  grade_point: 10.0 }
        - { min_marks: 80, grade: "A+", grade_point: 9.0 }
        - { min_marks: 70, grade: "A",  grade_point: 8.0 }
        - { min_marks: 60, grade: "B+", grade_point: 7.0 }
        - { min_marks: 50, grade: "B",  grade_point: 6.0 }
        - { min_marks: 40, grade: "C",  grade_point: 5.0 }
        - { min_marks: 0,  grade: "F",  grade_point: 0.0 }
    roll_number_pattern: "{year}{branch_code}{sequence:06d}"
    enrollment_pattern: "EN{year}{sequence:05d}"
    semester_naming: "Semester {number}"
    branches:
      - { code: "CSE",   name: "Computer Science and Engineering" }
      - { code: "ECE",   name: "Electronics and Communication Engineering" }
      - { code: "ME",    name: "Mechanical Engineering" }
      - { code: "CE",    name: "Civil Engineering" }
      - { code: "EE",    name: "Electrical Engineering" }
      - { code: "IT",    name: "Information Technology" }
      - { code: "AI_DS", name: "Artificial Intelligence and Data Science" }
    supported_templates:
      - marksheet_alpha
      - certificate_alpha
      - student_id_alpha

