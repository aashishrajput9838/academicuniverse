      <text x="12" y="129" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">Emotional &amp; Peer Support Portal</text>

      <rect x="0" y="156" width="315" height="42" rx="6" fill="url(#moduleGrad)" stroke="#CBD5E1"/>
      <text x="12" y="181" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">Multi-Tenant Admin &amp; Governance</text>
