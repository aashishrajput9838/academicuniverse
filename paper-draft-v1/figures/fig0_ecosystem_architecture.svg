    <rect x="735" y="0" width="345" height="34" rx="10" fill="#1E293B"/>
    <path d="M 735 20 L 1080 20 L 1080 34 L 735 34 Z" fill="#1E293B"/>
    <text x="907" y="22" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI ASSISTANCE &amp; STUDENT SUPPORT</text>
    
    <g transform="translate(750, 48)">
      <rect x="0" y="0" width="315" height="42" rx="6" fill="url(#moduleGrad)" stroke="#CBD5E1"/>
      <text x="12" y="25" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">AI Chatbot &amp; Academic Assistant</text>
      
      <rect x="0" y="52" width="315" height="42" rx="6" fill="url(#moduleGrad)" stroke="#CBD5E1"/>
