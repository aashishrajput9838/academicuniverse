  <!-- Footnote Scope Boundary Disclaimer -->
  <g transform="translate(60, 705)">
    <rect x="0" y="0" width="1080" height="45" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="20" y="27" font-family="Calibri, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">Research Scope Boundary:</text>
    <text x="165" y="27" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#1E3A8A">This publication evaluates exclusively the AU DIC module (highlighted above). Surrounding ecosystem modules are outside the research scope of this study and will be evaluated in separate dedicated publications.</text>
  </g>
