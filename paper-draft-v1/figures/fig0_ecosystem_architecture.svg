<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#2C4D75"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="targetHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="targetShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Outer Platform Container -->
  <rect x="30" y="30" width="1140" height="740" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Title Banner -->
  <path d="M 30 46 A 16 16 0 0 1 46 30 L 1154 30 A 16 16 0 0 1 1170 46 L 1170 100 L 30 100 Z" fill="url(#headerGrad)"/>
  <text x="600" y="62" font-family="Calibri, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ACADEMIC UNIVERSE PLATFORM ECOSYSTEM</text>
  <text x="600" y="86" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Student-Centric Multi-Tenant Educational SaaS Architecture • Research Module Breakdown</text>

  <!-- Ecosystem Sub-Label -->
  <rect x="50" y="115" width="1100" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="600" y="138" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Parent Platform Context: Interoperable Modules Supporting the Complete Student Lifecycle</text>

  <!-- HIGHLIGHTED TARGET RESEARCH MODULE (AU DIC) -->
  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="1080" height="195" rx="12" fill="url(#targetGrad)" stroke="#F59E0B" stroke-width="3" filter="url(#targetShadow)"/>
    
    <!-- Target Badge Header -->
    <rect x="0" y="0" width="1080" height="42" rx="12" fill="url(#targetHeaderGrad)"/>
    <path d="M 0 30 L 1080 30 L 1080 42 L 0 42 Z" fill="#B45309"/>
    <text x="25" y="27" font-family="Calibri, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">TARGET RESEARCH MODULE (THIS PAPER): AU DIC</text>
    <rect x="760" y="8" width="300" height="26" rx="13" fill="#FFFFFF"/>
    <text x="910" y="25" font-family="Calibri, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">EVALUATED IN THIS STUDY (V1.0.0)</text>

    <!-- Module Core Title -->
    <text x="30" y="72" font-family="Calibri, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B">Academic Universe Document Intelligence Core (AU DIC)</text>
    <text x="30" y="93" font-family="Calibri, Arial, sans-serif" font-size="13" fill="#475569">Verifiable Academic Credential Parsing • Multi-Tenant Multimodal AI &amp; HITL Staging Pipeline</text>

    <!-- Inner Key Features Grid -->
    <g transform="translate(30, 108)">
