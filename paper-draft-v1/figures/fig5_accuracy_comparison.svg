  <rect x="670" y="90" width="30" height="440" fill="#f57c00" opacity="0.8"/>
  <text x="685" y="83" text-anchor="middle" font-size="10" fill="#e65100">1.00</text>
  <rect x="705" y="90" width="30" height="440" fill="#c2185b" opacity="0.8"/>
  <text x="720" y="83" text-anchor="middle" font-size="10" fill="#880e4f">0.86</text>
  
  <!-- SYNTH_MS_005 -->
  <rect x="760" y="90" width="30" height="440" fill="#1976d2" opacity="0.8"/>
  <text x="775" y="83" text-anchor="middle" font-size="10" fill="#0d47a1">0.86</text>
  <rect x="795" y="90" width="30" height="440" fill="#388e3c" opacity="0.8"/>
