      <text x="15" y="24" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400E">Dual-Provider AI</text>
      <text x="15" y="44" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#64748B">Gemini 2.5 Flash + OpenRouter</text>
      
      <!-- Feature 2 -->
