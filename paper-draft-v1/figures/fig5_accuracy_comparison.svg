  <text x="60" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90 60 310)">Precision</text>
  
  <!-- Y-axis labels -->
  <text x="90" y="95" text-anchor="end" font-size="11" fill="#333">1.0</text>
  <line x1="100" y1="90" x2="860" y2="90" stroke="#eee" stroke-width="1"/>
