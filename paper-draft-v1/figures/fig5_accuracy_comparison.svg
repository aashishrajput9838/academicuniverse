  <rect x="170" y="597" width="16" height="12" fill="#1976d2" opacity="0.8"/>
  <text x="192" y="608" font-size="11" fill="#333">SYS-BASE-1 (Tesseract)</text>
  <rect x="340" y="597" width="16" height="12" fill="#388e3c" opacity="0.8"/>
  <text x="362" y="608" font-size="11" fill="#333">SYS-BASE-2 (Gemini)</text>
  <rect x="510" y="597" width="16" height="12" fill="#f57c00" opacity="0.8"/>
  <text x="532" y="608" font-size="11" fill="#333">SYS-BASE-3 (OpenRouter)</text>
  <rect x="690" y="597" width="16" height="12" fill="#c2185b" opacity="0.8"/>
