  <text x="500" y="555" text-anchor="middle" font-size="11" fill="#333">SYNTH_ID_003</text>
  <text x="660" y="555" text-anchor="middle" font-size="11" fill="#333">SYNTH_MS_004</text>
  <text x="820" y="555" text-anchor="middle" font-size="11" fill="#333">SYNTH_MS_005</text>
  
  <!-- X-axis title -->
