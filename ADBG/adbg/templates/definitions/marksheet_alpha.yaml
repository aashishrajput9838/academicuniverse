# ----------------------------------------------------------
# ADBG Marksheet Alpha Template
# ----------------------------------------------------------

metadata:
  template_id: marksheet_alpha
  template_version: 1.0.0
  author: Academic Universe Research Team
  description: Modern university grade marksheet template with header, info grid, marks table, and summary box.
  document_type: marksheet
  supported_universities:
    - university_alpha
    - university_beta
    - university_gamma
    - university_delta

page:
  size: A4
  orientation: portrait
  margins:
    top: 36
    right: 36
    bottom: 36
    left: 36

watermark:
  text: "SYNTHETIC BENCHMARK DATASET"
  color: "#e2e8f0"
  font_size: 32
  rotation: 35

disclaimer:
  text: "OFFICIAL BENCHMARK SPECIMEN — GENERATED BY ADBG v1.0 — FOR RESEARCH ONLY"
  color: "#64748b"
  font_size: 8
  y: 20

elements:
  # Header Band
  - type: rect
    x: 40
    y: 40
    width: 515
    height: 70
    fill: "#1a2e5a"
    stroke: "#0f172a"

  - type: text
    text: "{university.name}"
    x: 297
    y: 65
    font: Helvetica-Bold
    font_size: 16
    color: "#ffffff"
    align: center

  - type: text
    text: "{university.tagline}"
    x: 297
    y: 85
    font: Helvetica
    font_size: 10
    color: "#93c5fd"
    align: center

  # Document Title
  - type: text
    text: "OFFICIAL STATEMENT OF MARKS"
    x: 297
    y: 130
    font: Helvetica-Bold
    font_size: 14
    color: "#1e293b"
    align: center

  - type: line
    x1: 40
    y1: 140
    x2: 555
    y2: 140
    color: "#cbd5e1"
    width: 1

  # Student Info Grid
  - type: info_grid
    x: 40
    y: 160
    columns: 2
    col_width: 250
    row_height: 18
    font_size: 9
    fields:
      - label: "Student Name"
        value: "{student.student_name}"
      - label: "Roll Number"
        value: "{student.roll_number}"
      - label: "Enrollment No"
        value: "{student.enrollment_number}"
      - label: "Branch/Degree"
        value: "{student.branch_name}"
      - label: "Batch"
        value: "{student.batch_years}"
      - label: "Issue Date"
        value: "{issue_date}"

  # Course Marks Table
  - type: table
    x: 40
    y: 280
    col_widths: [80, 225, 60, 60, 90]
    headers: ["Course Code", "Course Title", "Credits", "Grade", "Marks Obtained"]
    header_bg: "#1a2e5a"
    row_height: 20

  # Summary Box
  - type: summary_box
    x: 40
    y: 680
    width: 515
    height: 35
    bg: "#f1f5f9"
    border: "#cbd5e1"
    text: "Cumulative Grade Point Average (CGPA): {cgpa} / 10.00"
