# ----------------------------------------------------------
# ADBG Certificate Alpha Template
# ----------------------------------------------------------

metadata:
  template_id: certificate_alpha
  template_version: 1.0.0
  author: Academic Universe Research Team
  description: Elegant degree certificate template in landscape mode.
  document_type: certificate
  supported_universities:
    - university_alpha
    - university_beta
    - university_gamma
    - university_delta

page:
  size: A4
  orientation: landscape
  margins:
    top: 36
    right: 36
    bottom: 36
    left: 36

watermark:
  text: "ACADEMIC BENCHMARK SPECIMEN"
  color: "#f1f5f9"
  font_size: 42
  rotation: 25

disclaimer:
  text: "SYNTHETIC BENCHMARK CERTIFICATE — FOR AI/DOC-AI RESEARCH EVALUATION ONLY"
  color: "#94a3b8"
  font_size: 8
  y: 20

elements:
  # Outer Decorative Border
  - type: rect
    x: 30
    y: 30
    width: 782
    height: 535
    fill: null
    stroke: "#1a2e5a"
    stroke_width: 3

  - type: rect
    x: 36
    y: 36
    width: 770
    height: 523
    fill: null
    stroke: "#cbd5e1"
    stroke_width: 1

  # Header
  - type: text
    text: "{university.name}"
    x: 421
    y: 90
    font: Times-Bold
    font_size: 24
    color: "#1a2e5a"
    align: center

  - type: text
    text: "{university.tagline}"
    x: 421
    y: 115
    font: Times-Italic
    font_size: 12
    color: "#475569"
    align: center

  # Document Title
  - type: text
    text: "BACHELOR OF TECHNOLOGY"
    x: 421
    y: 170
    font: Times-Bold
    font_size: 20
    color: "#0f172a"
    align: center

  - type: text
    text: "This is to certify that"
    x: 421
    y: 220
    font: Times-Roman
    font_size: 14
    color: "#334155"
    align: center

  # Recipient Name
  - type: text
    text: "{student.student_name}"
    x: 421
    y: 260
    font: Times-Bold
    font_size: 22
    color: "#1e3a8a"
    align: center

  - type: line
    x1: 260
    y1: 270
    x2: 580
    y2: 270
    color: "#94a3b8"
    width: 1

  # Degree Body Text
  - type: text
    text: "having successfully fulfilled all academic requirements, is awarded the degree of"
    x: 421
    y: 310
    font: Times-Roman
    font_size: 13
    color: "#334155"
    align: center

  - type: text
    text: "{student.degree_name}"
    x: 421
    y: 345
    font: Times-Bold
    font_size: 16
    color: "#0f172a"
    align: center

  - type: text
    text: "with Cumulative Grade Point Average of {cgpa} / 10.00 in the batch of {student.batch_years}."
    x: 421
    y: 380
    font: Times-Roman
    font_size: 13
    color: "#334155"
    align: center

  # Issue Info & Signatures
  - type: text
    text: "Date of Issue: {issue_date}"
    x: 100
    y: 480
    font: Helvetica
    font_size: 10
    color: "#475569"

  - type: text
    text: "Roll No: {student.roll_number}"
    x: 100
    y: 495
    font: Helvetica
    font_size: 10
    color: "#475569"

  - type: line
    x1: 600
    y1: 470
    x2: 740
    y2: 470
    color: "#0f172a"
    width: 1

  - type: text
    text: "Registrar / Vice Chancellor"
    x: 670
    y: 485
    font: Times-Italic
    font_size: 10
    color: "#334155"
    align: center
