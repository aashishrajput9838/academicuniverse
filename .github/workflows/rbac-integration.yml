name: RBAC Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rbac-integration:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/academic_universe_test
      JWT_SECRET: test-secret
      JWT_EXPIRY: 7d
      PORT: 5000
    services:
      mongodb:
        image: mongo:5.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            nc -z localhost 27017 && break
            echo "Waiting for MongoDB..."
            sleep 1
          done

      - name: Run DB seed
        run: npm run seed
        working-directory: backend

      - name: Start backend (dev)
        run: |
          npm run dev &
          for i in {1..30}; do
            curl -sS http://localhost:5000/health && break || echo "waiting...";
            sleep 1
          done
        working-directory: backend

      - name: Run RBAC integration tests (Jest)
        run: npm test --silent
        working-directory: backend
